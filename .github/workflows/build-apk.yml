name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER_STR=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VER_STR"
          
          # Extract major version
          if [[ "$JAVA_VER_STR" =~ version\ \"([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VER_STR" =~ \"1\.([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          else
            echo "ERROR: Unable to detect Java major version from '$JAVA_VER_STR'"
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created!"
            exit 1
          fi
          echo "Temporary debug.keystore is ready."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Listing files in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file is empty at $EXPECTED_APK"
            exit 1
          fi

          echo "Verified debug APK: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$ASSET_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW#*/}"
          # Sanitize repository name for safe filename
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
          
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset copy failed or file is empty at $ASSET_PATH"
            exit 1
          fi
          
          echo "Prepared release asset at: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset missing or empty at $ASSET_PATH"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug Build
          
          - **Build Type:** Debug APK (Testing)
          - **Built By:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** \`${{ github.sha }}\`
          - **Signing:** Temporary debug keystore
          
          > **Note:** This APK is automatically generated for testing purposes and is not a Play Store production release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$RELEASE_TAG"
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK built successfully!**"
              echo ""
              echo "### 📦 Direct Download Links"
              echo "- **GitHub Release:** [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Direct APK Asset:** \`$ASSET_NAME\` (available under the [Release Assets]($RELEASE_URL))"
              echo "- **Actions Artifact:** \`app-debug-apk\` (available as a backup under Workflow Artifacts)"
              echo ""
              echo "📱 Download the APK directly to your Android device from the Release Assets section."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK was built successfully and is preserved in GitHub Actions artifacts."
            
            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK built successfully!**"
              echo ""
              echo "⚠️ **GitHub Release publishing encountered an issue or was skipped.**"
              echo ""
              echo "### 📦 Backup Download"
              echo "- **Actions Artifact:** \`app-debug-apk\` is available under the Workflow Summary Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
